<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <filter id="glow-ram" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="40" y="40" fill="#ffffff" font-size="18" font-weight="bold">Efficienza Hardware: Footprint Memoria KV-Cache per Lunghezza Contesto</text>
  <text x="40" y="62" fill="#94a3b8" font-size="12">Megabyte di RAM per Richiesta: Sentinel R-08 (2 strati) vs Transformer Standard (12-14 strati)</text>

  <!-- Legend -->
  <g transform="translate(40, 85)" font-size="12" font-weight="600">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#38bdf8" stroke-width="3.8"/>
    <circle cx="12" cy="0" r="4" fill="#38bdf8"/>
    <text x="32" y="4" fill="#38bdf8">Sentinel R-08 v7.2a (0.8 MB a 512 ctx - 7× Più Leggero!)</text>

    <line x1="370" y1="0" x2="394" y2="0" stroke="#818cf8" stroke-width="2.5"/>
    <circle cx="382" cy="0" r="3.5" fill="#818cf8"/>
    <text x="402" y="4" fill="#818cf8">Transformer Baseline (5.6 MB a 512 ctx)</text>

    <line x1="670" y1="0" x2="694" y2="0" stroke="#34d399" stroke-width="2"/>
    <circle cx="682" cy="0" r="3.5" fill="#34d399"/>
    <text x="702" y="4" fill="#34d399">GPT-2 Small (9.8 MB)</text>
  </g>

  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4">
    <line x1="80" y1="130" x2="800" y2="130"/>
    <line x1="80" y1="180" x2="800" y2="180"/>
    <line x1="80" y1="230" x2="800" y2="230"/>
    <line x1="80" y1="280" x2="800" y2="280"/>
    <line x1="80" y1="330" x2="800" y2="330"/>
    <line x1="80" y1="380" x2="800" y2="380"/>

    <line x1="224" y1="120" x2="224" y2="380"/>
    <line x1="368" y1="120" x2="368" y2="380"/>
    <line x1="512" y1="120" x2="512" y2="380"/>
    <line x1="656" y1="120" x2="656" y2="380"/>
    <line x1="800" y1="120" x2="800" y2="380"/>
  </g>

  <!-- Axes -->
  <line x1="80" y1="380" x2="800" y2="380" stroke="#475569" stroke-width="1.5"/>
  <line x1="80" y1="120" x2="80" y2="380" stroke="#475569" stroke-width="1.5"/>

  <!-- Y Labels (RAM in MB) -->
  <g fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="end">
    <text x="72" y="134">40 MB</text>
    <text x="72" y="184">30 MB</text>
    <text x="72" y="234">20 MB</text>
    <text x="72" y="284">10 MB</text>
    <text x="72" y="334">5 MB</text>
    <text x="72" y="384">0 MB</text>
  </g>

  <!-- X Labels (Context Length) -->
  <g fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="middle">
    <text x="80" y="402">128</text>
    <text x="224" y="402">256</text>
    <text x="368" y="402">512</text>
    <text x="512" y="402">1024</text>
    <text x="656" y="402">1536</text>
    <text x="800" y="402">2048 token</text>
  </g>

  <!-- Curves -->
  <!-- GPT-2 Small -->
  <path d="M 80,368 L 224,352 L 368,321 L 512,260 L 656,198 L 800,135" fill="none" stroke="#34d399" stroke-width="2"/>
  <!-- Transformer Baseline -->
  <path d="M 80,372 L 224,364 L 368,345 L 512,310 L 656,275 L 800,240" fill="none" stroke="#818cf8" stroke-width="2.5"/>
  <!-- Sentinel R-08 v7.2a (FLAT EFFICIENT LINE) -->
  <path d="M 80,378 L 224,377 L 368,375 L 512,370 L 656,365 L 800,360" fill="none" stroke="#38bdf8" stroke-width="3.8" filter="url(#glow-ram)"/>

  <circle cx="368" cy="375" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
  <rect x="310" y="340" width="115" height="22" rx="4" fill="#0284c7" opacity="0.9"/>
  <text x="367" y="355" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">Sentinel: 0.8 MB</text>

  <circle cx="368" cy="345" r="5" fill="#818cf8" stroke="#ffffff" stroke-width="2"/>
  <rect x="300" y="310" width="135" height="22" rx="4" fill="#4338ca" opacity="0.9"/>
  <text x="367" y="325" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">Transformer: 5.6 MB</text>
</svg>