<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="r08grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="40" y="40" fill="#ffffff" font-size="18" font-weight="bold">Curva di Efficienza dei Token: Convergenza Pretrain (Loss vs Token Addestrati)</text>
  <text x="40" y="62" fill="#94a3b8" font-size="12">Sentinel R-08 v7.2a vs Transformer Baseline, Pythia-70M e GPT-2 Small</text>

  <!-- Legend -->
  <g transform="translate(40, 85)" font-size="12" font-weight="600">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#38bdf8" stroke-width="3.5"/>
    <circle cx="12" cy="0" r="4" fill="#38bdf8"/>
    <text x="32" y="4" fill="#38bdf8">Sentinel R-08 v7.2a (Geodetico 51.6M)</text>

    <line x1="270" y1="0" x2="294" y2="0" stroke="#818cf8" stroke-width="2.5"/>
    <circle cx="282" cy="0" r="3.5" fill="#818cf8"/>
    <text x="302" y="4" fill="#818cf8">Transformer Baseline (44.9M)</text>

    <line x1="510" y1="0" x2="534" y2="0" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="522" cy="0" r="3.5" fill="#fbbf24"/>
    <text x="542" y="4" fill="#fbbf24">Pythia-70M</text>

    <line x1="640" y1="0" x2="664" y2="0" stroke="#34d399" stroke-width="2"/>
    <circle cx="652" cy="0" r="3.5" fill="#34d399"/>
    <text x="672" y="4" fill="#34d399">GPT-2 Small</text>
  </g>

  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4">
    <line x1="80" y1="130" x2="800" y2="130"/>
    <line x1="80" y1="180" x2="800" y2="180"/>
    <line x1="80" y1="230" x2="800" y2="230"/>
    <line x1="80" y1="280" x2="800" y2="280"/>
    <line x1="80" y1="330" x2="800" y2="330"/>
    <line x1="80" y1="380" x2="800" y2="380"/>

    <line x1="224" y1="120" x2="224" y2="380"/>
    <line x1="368" y1="120" x2="368" y2="380"/>
    <line x1="512" y1="120" x2="512" y2="380"/>
    <line x1="656" y1="120" x2="656" y2="380"/>
    <line x1="800" y1="120" x2="800" y2="380"/>
  </g>

  <!-- Axes -->
  <line x1="80" y1="380" x2="800" y2="380" stroke="#475569" stroke-width="1.5"/>
  <line x1="80" y1="120" x2="80" y2="380" stroke="#475569" stroke-width="1.5"/>

  <!-- Y Labels (Loss) -->
  <g fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="end">
    <text x="72" y="134">5.0</text>
    <text x="72" y="184">4.0</text>
    <text x="72" y="234">3.0</text>
    <text x="72" y="284">2.0</text>
    <text x="72" y="334">1.0</text>
    <text x="72" y="384">0.0</text>
  </g>

  <!-- X Labels (Tokens) -->
  <g fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="middle">
    <text x="80" y="402">0M</text>
    <text x="224" y="402">150M</text>
    <text x="368" y="402">300M</text>
    <text x="512" y="402">500M</text>
    <text x="656" y="402">650M</text>
    <text x="800" y="402">740M tok</text>
  </g>

  <!-- Curve Lines -->
  <!-- GPT-2 Small -->
  <path d="M 80,125 C 224,175 368,220 512,240 S 656,248 800,250" fill="none" stroke="#34d399" stroke-width="2"/>
  <!-- Pythia-70M -->
  <path d="M 80,128 C 224,195 368,245 512,265 S 656,275 800,280" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <!-- Transformer Baseline -->
  <path d="M 80,135 C 224,270 368,318 512,328 S 656,332 800,335" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="none"/>
  <!-- Sentinel R-08 v7.2a (HERO LINE) -->
  <path d="M 80,126 C 224,265 368,310 512,322 S 656,326 800,328" fill="none" stroke="#38bdf8" stroke-width="3.8" filter="url(#glow)"/>

  <!-- Key Target Highlight Marker for Sentinel R-08 -->
  <circle cx="800" cy="328" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
  <rect x="660" y="295" width="135" height="24" rx="4" fill="#0284c7" opacity="0.9"/>
  <text x="727" y="311" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Loss: 1.0428 (100%)</text>
</svg>